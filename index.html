<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Bot Messenger</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .btn-primary {
            border-radius: 10px;
        }
        .main-form-container{
            background-color: #fff;
            padding: 2%;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            width: 65vh;
            margin-left: 10px;
            margin-right: 10px;
        }
        .form-row textarea{
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            height: 45vh;
        }
        .submit-button{
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card p-4 main-form-container">
            <div class="row row-cols-2">
               <div class="col">
                  <div class="input-group">
                     <span title="Leave this field blank for an anonymous message." style="cursor: help;" class="input-group-text" id="basic-addon1" style="color: gray;">↳</span>
                     <label>
                         <input class="text-center form-control" type="text" placeholder="Sender name" id="sender-name basic-addon1 textInput">
                     </label>
                 </div>
               </div>
               <div class="col"></div>
            </div>
            <form id="messageForm" class="my-2">
                <div class="mb-3 form-row">
                    <!-- <label for="message" class="form-label">Your Message</label> -->
                    <textarea id="message" class="form-control" rows="4" placeholder="Type your message here..." required></textarea>
                </div>
                <div class="d-grid"></div>   
                <div class="row row-cols-2">
                    <div class="col">
                        <div class="input-group">
                            <!-- инпут снизу --- onclick="openM()" -->
                            <input type="button" class="input-group-text" data-bs-toggle="modal" data-bs-target="#exampleModal" id="basic-addon2" style="color: gray;" value="+" ></input>
                            <select class="form-select form-control" id="basic-addon2 selectACC" aria-label="Default select example" style="height: 45px;">
                                <option selected disabled>Получатель</option>
                                <option value="1">One</option>
                                <option value="2">Two</option>
                                <option value="3">Three</option>
                            </select>
                        </div>
                    </div>
                    <div class="col">
                        <button  class="btn btn-outline-primary submit-button">Send Message</button>
                    </div>
                </div>
            </form>
            <div id="response" class="mt-3 text-center"></div>
        </div>
    </div>

    <script>
        document.getElementById('messageForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const chatId = "1352317933";
            const botToken = "7658217003:AAGfRUjCMbu5hEpuTxwS4Rz4HWRm0Va_fw4";
            const message = document.getElementById('message').value;

            try {
                const response = await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: message,
                    }),
                });

                const data = await response.json();
                const responseDiv = document.getElementById('response');

                if (data.ok) {
                    responseDiv.innerHTML = '<div class="alert alert-success">Message sent successfully!</div>';
                    
                } else {
                    responseDiv.innerHTML = `<div class="alert alert-danger">Error: ${data.description}</div>`;
                }
            } catch (error) {
                document.getElementById('response').innerHTML = '<div class="alert alert-danger">Failed to send the message. Please try again later.</div>';
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
