<!doctype html>
<html lang="en" data-bs-theme="dark">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Telegram ReSend</title>
      <link rel="stylesheet" href="style.css" />
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
      <style>
         .btn-primary {
            border-radius: 10px;
         }

         .main-form-container {
            background: rgba(255, 255, 255, 0.05);
            padding: 2%;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            width: 65vh;
            margin-left: 10px;
            margin-right: 10px;
         }

         .card {
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);

            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
         }

         .form-control {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
         }

         .form-control::placeholder {
            color: rgba(199, 165, 253, 0.753);
         }
         .form-control.regCSS::placeholder {
            color: gray;
         }

         .form-control:focus {
            background: rgba(255, 255, 255, 0.05);
            border-color: #4caf50;
            box-shadow: 0 0 8px rgba(76, 175, 80, 0.5);
            outline: none;
         }

         .addDiv:focus {
            border-color: #4caf50;
            box-shadow: 0 0 8px rgba(76, 175, 80, 0.5);
            outline: none;
         }

         .form-row textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 5px;
            height: 25vh;
         }

         .submit-button {
            width: 100%;
            height: 100%;
         }

         body {
            transition:
               background 2.5s ease,
               color 2.5s ease;
         }

         .checkboxStyle {
            background-color: rgba(255, 255, 255, 0.05);
         }

         .checkboxStyle:checked {
            background-color: rgba(199, 165, 253, 0.336);
            color: rgba(199, 165, 253, 0.753);
            border-color: #4caf50;
         }
      </style>
   </head>
   <body>
      <div class="container">
         <div class="row min-vh-100 d-flex align-items-center justify-content-center">
            <div class="col-lg-6 d-flex justify-content-center">
               <!--  -->
               <div class="card p-4 main-form-container">
                  <div class="row row-cols-2">
                     <div class="col">
                        <div class="input-group">
                           <span
                              title="Leave blank for an anonymous message."
                              style="
                                 cursor: help;
                                 background: transparent;
                                 border: 1px solid rgba(255, 255, 255, 0.08);
                                 color: rgba(199, 165, 253, 0.753);
                              "
                              class="input-group-text"
                              id="basic-addon1"
                              >↳</span
                           >
                           <label>
                              <input
                                 style="color: rgba(199, 165, 253, 0.753)"
                                 title="Leave blank for an anonymous message."
                                 class="text-center form-control"
                                 type="text"
                                 placeholder="Name"
                                 id="sender-name"
                              />
                           </label>
                        </div>
                     </div>
                     <div class="row row-cols-2">
                        <div class="col">
                           <div style="color: rgba(199, 165, 253, 0.753)" class="form-check form-switch advanced-div">
                              <input
                                 title="Show more"
                                 type="checkbox"
                                 class="form-check-input checkboxStyle"
                                 style="border: transparent"
                                 id="toggleCheckbox"
                              />
                              <label title="Show more" class="form-check-label" for="flexSwitchCheckDefault">More</label>
                           </div>
                        </div>
                        <div class="col">
                           <div style="color: rgba(199, 165, 253, 0.753)" class="form-check form-switch advanced-div">
                              <input
                                 title="Show list"
                                 type="checkbox"
                                 class="form-check-input checkboxStyle"
                                 style="border: transparent"
                                 id="toggleMembers"
                              />
                              <label title="Show more" class="form-check-label" for="flexSwitchCheckDefault">Show list</label>
                           </div>
                        </div>
                     </div>
                  </div>
                  <form id="messageForm" class="my-2">
                     <div class="mb-3 form-row">
                        <textarea
                           id="message"
                           style="background: transparent; color: rgba(199, 165, 253, 0.753)"
                           class="form-control"
                           rows="4"
                           placeholder="Type your message here..."
                           required
                        ></textarea>
                     </div>
                     <div class="advanced" id="advanced" style="display: none">
                        <div class="mb-3">
                           <input class="form-control" type="file" id="file" />
                        </div>
                     </div>
                     <div class="d-grid"></div>
                     <div class="row row-cols-2">
                        <div class="col">
                           <div class="input-group">
                              <input
                                 type="button"
                                 class="input-group-text"
                                 style="color: rgba(199, 165, 253, 0.753); background: transparent; border: 1px solid rgba(255, 255, 255, 0.08)"
                                 id="regmodalbtn"
                                 value="+"
                                 data-bs-toggle="modal"
                                 data-bs-target="#RegModal"
                              />
                              <!-- <select class="form-select form-control" id="recipient-select" style="height: 45px; color: rgba(199, 165, 253, 0.753); background: transparent;">
                                <option selected disabled>Recipient</option>
                                <option value="1352317933">@kapustaa234</option>
                                <option value="987654321">...</option>
                                <option value="123456789">...</option>
                            </select> -->
                              <input type="text" class="form-select form-control text-center" id="recipient-select" placeholder="Recipient's ID" />
                           </div>
                        </div>
                        <div class="col">
                           <button class="btn btn-outline-primary submit-button">Send</button>
                        </div>
                     </div>
                  </form>
                  <div id="response" class="mt-3 text-center"></div>
               </div>
            </div>
         </div>
      </div>

      <div class="modal fade" id="RegModal" tabindex="-1" aria-labelledby="RegModalLabel" aria-hidden="true">
         <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
               <div class="modal-header text-center">
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
               </div>
               <div class="modal-body p-4 py-5 p-md-5">
                  <h3 class="text-center">
                     Create your Shortcut
                     <i
                        title="You can add a name for quick access to your Telegram ID in the Memberlist"
                        class="bi bi-info-circle custom_icircle"
                        style="font-size: medium; position: relative; bottom: 10px"
                     ></i>
                  </h3>
                  <form action="#" class="signup-form">
                     <div class="form-group mb-2">
                        <label for="name"
                           >Nickname
                           <i title="Must contain from 3 to 25 characters" class="bi bi-info-circle custom_icircle" style="font-size: small"></i>
                        </label>
                        <input type="text" class="form-control regCSS" id="reg-nickname" placeholder="GeorgeFloyd1488" />
                     </div>
                     <div class="form-group mb-2">
                        <label for="id"
                           >Telegram ID <i title="Run /myid in bot's chat" class="bi bi-info-circle custom_icircle" style="font-size: small"></i
                        ></label>
                        <input type="text" class="form-control regCSS" id="reg-chatid" placeholder="0000000000" />
                     </div>
                     <div class="" id="descdiv" style="display: none">
                        <div class="form-group mb-2">
                           <label for="id">Short Description</label>
                           <input type="text" class="form-control regCSS" id="reg-description" placeholder="Something about You..." />
                        </div>
                     </div>
                     <div class="row row-cols-2">
                        <div class="col">
                           <div class="form-check form-switch advanced-div">
                              <input
                                 title="Add short descrtiption"
                                 type="checkbox"
                                 class="form-check-input checkboxStyle"
                                 style="border: transparent"
                                 id="actdescdiv"
                              />
                              <label title="Add short descrtiption" class="form-check-label" for="flexSwitchCheckDefault">Add descrtiption</label>
                           </div>
                        </div>
                        <div class="col">
                           <input type="checkbox" class="form-check-input checkboxStyle" id="reg-public" checked />
                           <label for="Public"
                              >Public Nickname
                              <i title="Anyone can view and chose Your Nickname" class="bi bi-info-circle custom_icircle" style="font-size: small"></i
                           ></label>
                        </div>
                     </div>

                     <p></p>
                     <div class="form-group mb-2">
                        <button type="submit" class="form-control btn btn-primary rounded submit px-3">Attach on Memberlist</button>
                     </div>
                     <div class="form-group d-md-flex"></div>
                  </form>
               </div>
            </div>
         </div>
      </div>
      <div id="members-panel" class="members-panel" style="display: none">
         <h5 class="text-center mb-3">
            Public list
            <i class="bi bi-chevron-up" style="position: relative; left: 80px" id="showpb"></i>
         </h5>
         <div id="pbtable">
            <table class="table tablecl tablecl-hover text-center align-middle">
               <thead>
                  <tr>
                     <th>Name</th>
                     <th>Description</th>
                  </tr>
               </thead>
               <tbody>
                  <tr onclick="selectUser('1352317933')">
                     <td>@kapustaa2345</td>
                     <td>+</td>
                  </tr>
                  <tr>
                     <td onclick="selectUser('9876543210')">person2</td>
                     <td>987654321</td>
                  </tr>
               </tbody>
            </table>
         </div>

         <h5 class="text-center mb-3">
            Private list
            <i class="bi bi-chevron-up" style="position: relative; left: 80px" id="showpv"></i>
         </h5>
         <div id="pvtable">
            <table class="table tablecl tablecl-hover text-center align-middle">
               <thead>
                  <tr>
                     <th>Name</th>
                     <th>Description</th>
                  </tr>
               </thead>
               <tbody>
                  <tr onclick="selectUser('1352317933')">
                     <td>@kapustaa2345</td>
                     <td>+</td>
                  </tr>
                  <tr>
                     <td onclick="selectUser('9876543210')">person2</td>
                     <td>987654321</td>
                  </tr>
               </tbody>
            </table>
         </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
      <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
      <script src="script.js"></script>
   </body>
</html>
