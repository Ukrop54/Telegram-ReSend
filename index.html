<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Bot Messenger</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .btn-primary {
            border-radius: 10px;
        }
        .main-form-container{
            background-color: #fff;
            padding: 2%;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            width: 65vh;
            margin-left: 10px;
            margin-right: 10px;
        }
        .form-row textarea{
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            height: 20vh;
        }
        .submit-button{
            width: 100%;
            height: 100%;
        }
        @media (max-width: 764px) {
            #basic-addon1 {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card p-4 main-form-container">
            <div class="row row-cols-2">
               <div class="col">
                  <div class="input-group">
                     <span title="Leave this field blank for an anonymous message." style="cursor: help;" class="input-group-text" id="basic-addon1" style="color: gray;">↳</span>
                     <label>
                         <input class="text-center form-control" type="text" placeholder="Sender name" id="sender-name">
                     </label>
                 </div>
               </div>
               <div class="col"></div>
            </div>
            <form id="messageForm" class="my-2">
                <div class="mb-3 form-row">
                    <textarea id="message" class="form-control" rows="4" placeholder="Type your message here..."></textarea>
                </div>
                <div class="mb-3">
                    <input class="form-control" type="file" id="file">
                </div>
                <div class="d-grid"></div>   
                <div class="row row-cols-2">
                    <div class="col">
                        <div class="input-group">
                            <input type="button" class="input-group-text" data-bs-toggle="modal" data-bs-target="#exampleModal" id="basic-addon2" style="color: gray;" value="+" ></input>
                            <select class="form-select form-control" id="recipient-select" aria-label="Default select example" style="height: 45px;">
                                <option selected disabled>Recipient</option>
                                <option value="1352317933">@kapustaa234</option>
                                <option value="987654321">...</option>
                                <option value="123456789">...</option>
                            </select>
                        </div>
                    </div>
                    <div class="col">
                        <button  class="btn btn-outline-primary submit-button">Send Message</button>
                    </div>
                </div>
            </form>
            <div id="response" class="mt-3 text-center"></div>
        </div>
    </div>

    <script>
        document.getElementById('messageForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const botToken = "7658217003:AAGfRUjCMbu5hEpuTxwS4Rz4HWRm0Va_fw4";
            const senderName = document.getElementById('sender-name').value;
            const NRmessage = document.getElementById('message').value;
            const recipient = document.getElementById('recipient-select').value;
            const fileInput = document.getElementById('file');

            if (!recipient) {
                document.getElementById('response').innerHTML = '<div class="alert alert-danger">Please select a recipient.</div>';
                return;
            }

            const formData = new FormData();
            formData.append('chat_id', recipient);
            formData.append('caption', senderName ? `From: ${senderName}\n${NRmessage}` : NRmessage);

            if (fileInput.files.length > 0) {
                formData.append('document', fileInput.files[0]);
            }

            const endpoint = fileInput.files.length > 0 ? 'sendDocument' : 'sendMessage';
            const url = `https://api.telegram.org/bot${botToken}/${endpoint}`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    body: fileInput.files.length > 0 ? formData : JSON.stringify({
                        chat_id: recipient,
                        text: senderName ? `From: ${senderName}\n${NRmessage}` : NRmessage,
                    }),
                    headers: fileInput.files.length > 0 ? {} : {
                        'Content-Type': 'application/json',
                    },
                });

                const data = await response.json();
                const responseDiv = document.getElementById('response');

                if (data.ok) {
                    responseDiv.innerHTML = '<div class="alert alert-success">Message sent successfully!</div>';
                    document.getElementById('message').value = ''; // Clear the textarea
                    document.getElementById('sender-name').value = ''; // Clear the sender name
                    document.getElementById('file').value = ''; // Clear the file input
                } else {
                    responseDiv.innerHTML = `<div class="alert alert-danger">Error: ${data.description}</div>`;
                }
            } catch (error) {
                document.getElementById('response').innerHTML = '<div class="alert alert-danger">Failed to send the message. Please try again later.</div>';
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
